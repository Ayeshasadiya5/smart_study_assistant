{% extends "base.html" %}
{% block title %}{{ material.title }} - SmartNotes AI{% endblock %}
{% block content %}
<div class="container-fluid py-3">
    <div class="pdf-toolbar d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3 px-2">
        <div>
            <h4 class="mb-0">{{ material.title }}</h4>
            <small class="text-muted">{{ material.subject.name }} &bull; {{ material.year }} &bull; {{ material.semester }}</small>
        </div>
        <div class="d-flex gap-2 flex-wrap">
            <a href="{{ url_for('student.materials') }}" class="btn btn-outline-secondary btn-sm">
                <i class="fas fa-arrow-left me-1"></i>Back
            </a>
            <a href="{{ url_for('student.download_pdf', material_id=material.id) }}" class="btn btn-primary btn-sm">
                <i class="fas fa-download me-1"></i>Download
            </a>
            <a href="{{ url_for('ai.chat_page') }}?material_id={{ material.id }}" class="btn btn-success btn-sm">
                <i class="fas fa-robot me-1"></i>Ask AI about this PDF
            </a>
        </div>
    </div>
    <div class="pdf-viewer-container">
        <iframe src="{{ url_for('student.serve_pdf', material_id=material.id) }}" title="{{ material.title }}"></iframe>
    </div>
</div>
{% endblock %}
